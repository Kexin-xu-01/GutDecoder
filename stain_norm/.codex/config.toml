approval_policy = "on-request"
default_permissions = "codex_sandbox"

[permissions.codex_sandbox.filesystem]
":minimal" = "read"
":slash_tmp" = "write"
"/ceph-fast/package" = "read"
"/package" = "read"
"/ceph-fast/package/u22" = "read"
"/databank/10x-rangers" = "read"
"/ceph-fast/databank/10x-rangers" = "read"
"/databank/alphafold" = "read"
"/ceph/databank/alphafold" = "read"
"/databank/ensembl-vep" = "read"
"/ceph-fast/databank/ensembl-vep" = "read"
"/databank/exomiser" = "read"
"/ceph-fast/databank/exomiser" = "read"
"/databank/gnomAD" = "read"
"/ceph-fast/databank/gnomAD" = "read"
"/databank/igenomes" = "read"
"/ceph-fast/databank/igenomes" = "read"
"/databank/IGV-demo" = "read"
"/ceph-fast/databank/IGV-demo" = "read"
"/databank/indices" = "read"
"/ceph-fast/databank/indices" = "read"
"/databank/raw" = "read"
"/ceph-fast/databank/raw" = "read"
"/databank/singleron" = "read"
"/ceph-fast/databank/singleron" = "read"
"/databank/Zenodo" = "read"
"/ceph-fast/databank/Zenodo" = "read"
# Tell Codex that parents are read-only.
# Otherwise, Codex bwrap create writable
# ephemeral mirrors of parents - programs
# think they are writing into parent folder BUT
# changes disappear when Codex closes.
"/home" = "read"

[permissions.codex_sandbox.filesystem.":workspace_roots"]
"." = "write"

[permissions.codex_sandbox.workspace_roots]
"/ceph/project/gutdecoder/kxu/.local/lib/python3.11/site-packages/gutdecoder/stain_norm" = true

[features.network_proxy]
enabled = true

[permissions.codex_sandbox.network]
enabled = true
mode = "limited"
allow_local_binding = false

